# Suppress dtk false-positive data relocations in LidOpenMessage image data.
# These 43 words inside HEADER_*::g_ImageData arrays coincidentally hold values
# matching code-symbol addresses (UpdateDesireState, cCharacter dtor, FormatImpl,
# DisplayMatchSummary, etc.); they are raw compressed-image bytes, not pointers.
# Blocking lets the target object store the literal bytes so the C source
# byte-matches, and stops dtk renaming the referenced locals to <name>_<ADDR>.
